version: '3.8'

services:
  # PostgreSQL Database (Local - Comment out if using external/cloud database)
  # Uncomment this section if you want to use a local PostgreSQL container
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: bitterrock-db
  #   restart: unless-stopped
  #   env_file:
  #     - .docker.env
  #   environment:
  #     POSTGRES_USER: ${DB_USER:-postgres}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
  #     POSTGRES_DB: ${DB_NAME:-bitterrock_db}
  #   ports:
  #     - "${DB_PORT:-5433}:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./database/schemas/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - bitterrock-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitterrock-app
    restart: unless-stopped
    env_file:
      - .docker.env
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-bitterrock_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_SSL=${DB_SSL:-false}
      - DB_SSL_REJECT_UNAUTHORIZED=${DB_SSL_REJECT_UNAUTHORIZED:-true}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
    # depends_on:  # Comment out if using external database
    #   postgres:
    #     condition: service_healthy
    networks:
      - bitterrock-network
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  postgres_data:
    driver: local

networks:
  bitterrock-network:
    driver: bridge

